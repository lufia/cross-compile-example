name: Build

on:
  push:
    branches:
    - main
  pull_request:
jobs:
  build-linux:
    strategy:
      matrix:
        GOARCH: ['amd64', '386']
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: true
    - run: |
        sudo apt-get install gcc-multilib g++-multilib
        mkdir -p dist
        go build -o dist/hdb-linux-$GOARCH
      env:
        GOARCH: ${{ matrix.GOARCH }}
        CGO_ENABLED: 1
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-linux
        path: dist/hdb-linux-*
  build-windows:
    strategy:
      matrix:
        GOARCH: ['amd64', '386']
        include:
        - GOARCH: amd64
          MSYSTEM: MINGW64
        - GOARCH: '386'
          MSYSTEM: MINGW32
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: ${{ matrix.MSYSTEM }}
        path-type: inherit
        install: mingw-w64-i686-gcc
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: true
    - run: |
        mkdir -p dist
        go build -o dist/hdb-windows-$GOARCH.exe
      env:
        GOARCH: ${{ matrix.GOARCH }}
        CGO_ENABLED: 1
        CC_FOR_windows_386: i686-w64-mingw32-gcc
      shell: msys2 {0}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-windows
        path: dist/hdb-windows-*
